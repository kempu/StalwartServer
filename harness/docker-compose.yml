# The search harness: one Stalwart on one PostgreSQL, nothing else. It exists so a claim
# about what a search finds is measured against a server, never read from source. See
# README.md ("The search harness") and probe.py.
#
# STALWART_IMAGE picks the server under test: upstream's image for the stock baseline, or
# the image this repository builds. Everything else is fixed, so two runs differ only in
# the server. Nothing here is reachable from outside this machine.
name: stalwart-search-harness

services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_DB: stalwart
      POSTGRES_USER: stalwart
      POSTGRES_PASSWORD: ${HARNESS_PG_PASSWORD:?run.sh sets it}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stalwart -d stalwart"]
      interval: 2s
      timeout: 3s
      retries: 30

  stalwart:
    image: ${STALWART_IMAGE:?run.sh sets it}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HARNESS_PG_PASSWORD: ${HARNESS_PG_PASSWORD}
      STALWART_RECOVERY_ADMIN: "admin:${HARNESS_ADMIN_PASSWORD:?run.sh sets it}"
    volumes:
      - ./config.json:/etc/stalwart/config.json:ro
    ports:
      - "127.0.0.1:${HARNESS_HTTP_PORT:-18080}:8080"
